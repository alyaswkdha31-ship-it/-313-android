name: Build ElafYas Android APK
on:
  push:
    branches: [feature/elafyas-command-center-apk]
  pull_request:
    branches: [feature/313-voice-copy-chat]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build existing 313 Android app
        working-directory: 313-android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: elafyas-command-center-debug-apk
          path: 313-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
