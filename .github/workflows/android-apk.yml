name: Build ElafYas Android APK
on:
  push:
    branches: [feature/elafyas-command-center-apk, feature/ya-elaf-voice-wake-service]
  pull_request:
    branches: [feature/313-voice-copy-chat, feature/elafyas-command-center-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run Termux gateway policy tests
        working-directory: 313-android
        run: python -m unittest discover -s termux -p 'test_*.py'
      - name: Build existing 313 Android app
        working-directory: 313-android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: elafyas-command-center-debug-apk
          path: 313-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
